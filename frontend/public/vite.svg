<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Left Exchange Bubble -->
  <path d="M12 26 C12 17.7 18.7 11 27 11 C35.3 11 42 17.7 42 26 C42 34.3 35.3 41 27 41 C24.5 41 22.1 40.3 20.1 39.1 L12 41 L14 33.7 C12.7 31.4 12 28.8 12 26 Z" fill="url(#bridgeGrad)"/>

  <!-- Right Exchange Bubble -->
  <path d="M52 38 C52 45.7 45.7 52 38 52 C35.7 52 33.5 51.4 31.6 50.3 L24 52 L25.8 45.2 C24.7 43.1 24 40.6 24 38 C24 31.4 28.7 25.9 35 24.4 C36 24.1 37 24 38 24 C45.7 24 52 30.3 52 38 Z" fill="url(#bubbleGrad)"/>

  <!-- Connecting Bridge Arch (The "FluentBridge") -->
  <path d="M18 27 C22 17 32 17 36 27" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <path d="M28 39 C32 29 42 29 46 39" stroke="url(#bridgeGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Central Exchange Nodes -->
  <circle cx="27" cy="23" r="2.5" fill="#ffffff"/>
  <circle cx="37" cy="35" r="2.5" fill="#06b6d4"/>
</svg>
